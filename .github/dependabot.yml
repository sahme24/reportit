version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  # Python dependencies (requirements.txt and requirements-dev.txt, including
  # the pinned ruff version).
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"

  # Base image in the Dockerfile.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
