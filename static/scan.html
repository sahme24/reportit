<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Open a Case — Threadline</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css">
<style>
  .casebar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap;}
  .case-id{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--dim);letter-spacing:0.05em;}

  #intake textarea{min-height:300px;resize:vertical;line-height:1.7;}
  .intake-row{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap;}
  .intake-hint{font-size:12.5px;color:var(--faint);margin-right:auto;}

  .grid{display:grid;grid-template-columns:1fr 1.15fr;gap:20px;margin-bottom:20px;}
  @media (max-width:760px){.grid{grid-template-columns:1fr;}}

  .src-line{font-family:'IBM Plex Mono',monospace;font-size:12.5px;line-height:1.9;color:var(--dim);white-space:pre-wrap;word-break:break-all;}
  .src-line b{color:var(--ink);font-weight:500;}
  .src-flag{color:var(--red);}
  .src-ok{color:var(--teal);}
  .src-block{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line-strong);}

  .finding{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
  .finding:last-child{border-bottom:none;padding-bottom:0;}
  .finding:first-child{padding-top:0;}
  .finding .dot{margin-top:6px;}
  .finding-text{font-size:13.5px;line-height:1.5;}
  .finding-text .label{display:block;font-weight:600;font-size:13px;margin-bottom:2px;}
  .finding-text .detail{color:var(--dim);}

  .chain-row{display:flex;align-items:center;padding:24px 16px 20px;overflow-x:auto;}
  .node{display:flex;flex-direction:column;align-items:center;min-width:110px;flex-shrink:0;}
  .node-circle{
    width:40px;height:40px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;
    border:2px solid var(--line);background:var(--panel-2);color:var(--dim);
    animation:pop 0.5s ease backwards;
  }
  .node-circle.bad{border-color:var(--red);color:var(--red);background:var(--red-wash);}
  .node-circle.warn{border-color:var(--amber);color:var(--amber);background:var(--amber-wash);}
  .node-circle.ok{border-color:var(--teal);color:var(--teal);background:var(--teal-wash);}
  .node-label{font-size:11.5px;font-weight:500;margin-top:8px;text-align:center;}
  .node-sub{font-size:10.5px;color:var(--dim);margin-top:1px;font-family:'IBM Plex Mono',monospace;
    max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .connector{flex:1;height:2px;background:var(--line);min-width:32px;position:relative;top:-24px;}
  .connector.solid{background:var(--red);opacity:0.5;}
  @keyframes pop{from{transform:scale(0.6);opacity:0;}to{transform:scale(1);opacity:1;}}

  .actions{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;}
  .hidden{display:none !important;}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar" id="topbar"></header>

  <div class="casebar">
    <div>
      <div class="microlabel">Investigation</div>
      <span class="case-id" id="caseId">NEW CASE</span>
    </div>
    <span class="stamp hidden" id="verdict"></span>
  </div>

  <!-- intake -->
  <div id="intake" class="panel ticked" style="margin-bottom:20px;">
    <div class="panel-head"><span class="panel-title">Evidence Intake</span></div>
    <div class="panel-body">
      <textarea id="rawInput" spellcheck="false"
        placeholder="Paste the raw email source here — full headers + body.
Gmail: open the message → ⋮ → Show original → Copy to clipboard.
Outlook: ⋯ → View → View message source."></textarea>
      <div class="intake-row">
        <span class="intake-hint">Analysis runs on this server; reputation lookups are optional.</span>
        <button class="btn ghost" id="loadPhish">Load phishing sample</button>
        <button class="btn ghost" id="loadClean">Load clean sample</button>
        <label style="font-size:12.5px;color:var(--faint);display:flex;gap:6px;align-items:center;font-family:'IBM Plex Mono',monospace;">
          <input type="checkbox" id="offline" style="width:auto;"> offline
        </label>
        <button class="btn primary" id="analyze">Open Case →</button>
      </div>
      <div class="form-error" id="error"></div>
    </div>
  </div>

  <!-- results -->
  <div id="results" class="hidden">
    <div class="grid">
      <div class="panel">
        <div class="panel-head"><span class="panel-title">Raw Source</span></div>
        <div class="panel-body" id="rawSource"></div>
      </div>
      <div class="panel ticked">
        <div class="panel-head">
          <span class="panel-title">Findings</span>
          <span class="microlabel" id="scoreLabel"></span>
        </div>
        <div class="panel-body" id="findings"></div>
      </div>
    </div>

    <div class="panel" style="margin-bottom:20px;">
      <div class="panel-head"><span class="panel-title">Attack Chain</span></div>
      <div class="chain-row" id="chain"></div>
    </div>

    <div class="actions">
      <button class="btn" id="newCase">New Case</button>
      <button class="btn" id="exportJson">Export JSON</button>
      <button class="btn primary" id="exportBtn">Export Report (Markdown)</button>
    </div>
  </div>
</div>

<script src="/static/shared.js"></script>
<script>
let currentCase = null;
const $ = id => document.getElementById(id);
const esc = Threadline.esc;

Threadline.topbar("/scan").then(user => {
  if (!user) location.href = "/login?next=/scan";
});

async function loadSample(name){
  const r = await fetch(`/api/sample/${name}`);
  $("rawInput").value = await r.text();
  $("error").textContent = "";
}
$("loadPhish").onclick = () => loadSample("phish");
$("loadClean").onclick = () => loadSample("clean");

$("analyze").onclick = async () => {
  const raw = $("rawInput").value;
  if (!raw.trim()) { $("error").textContent = "Paste a raw email first."; return; }
  const btn = $("analyze");
  btn.disabled = true; btn.textContent = "Tracing…";
  try {
    const r = await fetch("/api/scan", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({raw, offline: $("offline").checked}),
    });
    if (r.status === 401) { location.href = "/login?next=/scan"; return; }
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    currentCase = data;
    render(currentCase);
  } catch (e) {
    $("error").textContent = "Scan failed: " + e.message;
  } finally {
    btn.disabled = false; btn.textContent = "Open Case →";
  }
};

function render(c){
  $("intake").classList.add("hidden");
  $("results").classList.remove("hidden");
  $("caseId").textContent = `CASE #${c.case_id}`;

  const sev = c.verdict === "MALICIOUS" ? "bad"
            : c.verdict === "SUSPICIOUS" ? "warn" : "ok";
  const v = $("verdict");
  v.className = `stamp ${sev}`;
  v.textContent = `● ${c.verdict} — ${c.confidence} CONFIDENCE`;
  $("scoreLabel").textContent = `RISK ${c.score}/100`;

  const authLine = (label, result) => {
    const cls = result === "pass" ? "src-ok" : (result === "unknown" ? "" : "src-flag");
    return `<div class="src-line"><b>${label}:</b> <span class="${cls}">${esc(result)}</span></div>`;
  };
  let src = `
    <div class="src-line"><b>From:</b> ${esc(c.headers.from)}</div>
    ${c.headers.reply_to ? `<div class="src-line"><b>Reply-To:</b> ${esc(c.headers.reply_to)}</div>` : ""}
    <div class="src-line"><b>Subject:</b> ${esc(c.headers.subject)}</div>
    <div class="src-block">
      ${authLine("SPF", c.auth.spf)}
      ${authLine("DKIM", c.auth.dkim)}
      ${authLine("DMARC", c.auth.dmarc)}
      ${c.auth.sender_ip ? `<div class="src-line"><b>Sender IP:</b> ${esc(c.auth.sender_ip)}</div>` : ""}
    </div>
    <div class="src-block"><div class="src-line">${esc(c.body_preview)}</div></div>`;
  if (c.urls.length){
    src += `<div class="src-block">` + c.urls.map(u =>
      `<div class="src-line"><b>URL:</b> <span class="${u.flags.length ? "src-flag" : ""}">${esc(u.defanged)}</span></div>`
    ).join("") + `</div>`;
  }
  $("rawSource").innerHTML = src;

  $("findings").innerHTML = c.findings.map(f => `
    <div class="finding">
      <div class="dot ${esc(f.severity)}"></div>
      <div class="finding-text">
        <span class="label">${esc(f.title)}</span>
        <span class="detail">${esc(f.detail)}</span>
      </div>
    </div>`).join("");

  $("chain").innerHTML = c.chain.map((n, i) => {
    const num = String(i + 1).padStart(2, "0");
    const sevClass = n.severity === "info" ? "" : n.severity;
    const node = `
      <div class="node">
        <div class="node-circle ${sevClass}" style="animation-delay:${0.05 + i * 0.15}s">${num}</div>
        <div class="node-label">${esc(n.label)}</div>
        <div class="node-sub">${esc(n.sub)}</div>
      </div>`;
    const connector = i < c.chain.length - 1
      ? `<div class="connector ${sev === "bad" ? "solid" : ""}"></div>` : "";
    return node + connector;
  }).join("");
}

function download(content, filename, type){
  const blob = new Blob([content], {type});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  URL.revokeObjectURL(a.href);
}
$("exportBtn").onclick = () => currentCase &&
  download(currentCase.report_markdown, `threadline-case-${currentCase.case_id}.md`, "text/markdown");
$("exportJson").onclick = () => currentCase &&
  download(JSON.stringify(currentCase, null, 2), `threadline-case-${currentCase.case_id}.json`, "application/json");

$("newCase").onclick = () => {
  currentCase = null;
  $("results").classList.add("hidden");
  $("intake").classList.remove("hidden");
  $("verdict").className = "stamp hidden";
  $("caseId").textContent = "NEW CASE";
};
</script>
</body>
</html>
