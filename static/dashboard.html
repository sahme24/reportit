<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — ReportIT.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css">
<style>
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
  @media (max-width:860px){.tiles{grid-template-columns:1fr 1fr;}}
  .tile{padding:20px 22px;}
  .tile .lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--faint);}
  .tile .num{font-family:'Poppins',sans-serif;font-size:32px;font-weight:700;margin-top:4px;}
  .tile .sub{font-size:12.5px;color:var(--faint);margin-top:2px;}

  .charts{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px;}
  @media (max-width:820px){.charts{grid-template-columns:1fr;}}
  .chart-body{padding:16px 16px 8px;}
  .chart-svg{width:100%;height:170px;display:block;}
  .bar{cursor:pointer;}
  .gridline{stroke:var(--line);stroke-width:1;}
  .axis-label{font-family:'IBM Plex Mono',monospace;font-size:9.5px;fill:var(--faint);}

  .tooltip{
    position:fixed;pointer-events:none;z-index:10;display:none;
    background:var(--panel);border:1px solid var(--line-strong);border-radius:8px;
    padding:7px 11px;font-family:'IBM Plex Mono',monospace;font-size:11.5px;
    color:var(--ink);box-shadow:var(--shadow);white-space:nowrap;
  }
  .verdict-split{display:flex;gap:16px;flex-wrap:wrap;padding:15px 18px;}
  .split-item{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--dim);}
  .split-item b{color:var(--ink);font-family:'Poppins',sans-serif;}

  .tables{display:grid;grid-template-columns:1fr 1fr;gap:20px;}
  @media (max-width:900px){.tables{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="topbar"></div>

<div class="wrap page">
  <div style="margin-bottom:22px;">
    <span class="microlabel">Admin only</span>
    <h2 style="font-size:24px;font-weight:700;">Instance Dashboard</h2>
  </div>

  <div class="tiles">
    <div class="panel tile lift">
      <div class="lab">Active Users</div>
      <div class="num" id="tUsers">—</div>
      <div class="sub" id="tUsersSub"></div>
    </div>
    <div class="panel tile">
      <div class="lab">Emails Investigated</div>
      <div class="num" id="tScans">—</div>
    </div>
    <div class="panel tile">
      <div class="lab">Malicious Verdicts</div>
      <div class="num" id="tMalicious">—</div>
      <div class="sub" id="tMaliciousSub"></div>
    </div>
    <div class="panel tile">
      <div class="lab">Indicators Flagged</div>
      <div class="num" id="tIndicators">—</div>
    </div>
  </div>

  <div class="charts">
    <div class="panel">
      <div class="panel-head"><span class="panel-title">Scans per day — last 14 days</span></div>
      <div class="chart-body"><svg class="chart-svg" id="scanChart"></svg></div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="panel-title">Signups per day — last 14 days</span></div>
      <div class="chart-body"><svg class="chart-svg" id="signupChart"></svg></div>
    </div>
  </div>

  <div class="panel" style="margin-bottom:20px;">
    <div class="panel-head"><span class="panel-title">Verdict breakdown</span></div>
    <div class="verdict-split" id="verdictSplit"></div>
  </div>

  <div class="tables">
    <div class="panel">
      <div class="panel-head"><span class="panel-title">Newest users</span></div>
      <div class="table-scroll">
        <table class="data">
          <thead><tr><th>Name</th><th>Email</th><th>Cases</th><th>Joined</th></tr></thead>
          <tbody id="userRows"></tbody>
        </table>
      </div>
    </div>
    <div class="panel">
      <div class="panel-head"><span class="panel-title">Latest cases</span></div>
      <div class="table-scroll">
        <table class="data">
          <thead><tr><th>Case</th><th>Verdict</th><th>From</th><th>User</th></tr></thead>
          <tbody id="scanRows"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

<div class="tooltip" id="tooltip"></div>

<script src="/static/shared.js"></script>
<script>
const esc = ReportIT.esc;
const chip = v => v === "MALICIOUS" ? "bad" : v === "SUSPICIOUS" ? "warn" : "ok";

/* Single-series bar chart: thin bars, rounded data-end at the top,
   2px gaps, recessive gridlines, per-bar hover tooltip. */
function barChart(svgEl, days, color){
  const W = svgEl.clientWidth || 460, H = 170, padB = 22, padT = 12, padL = 4;
  svgEl.setAttribute("viewBox", `0 0 ${W} ${H}`);

  // Fill in a continuous 14-day window so quiet days show as gaps, not lies.
  const byDay = Object.fromEntries(days.map(d => [d.day, d.c]));
  const series = [];
  for (let i = 13; i >= 0; i--) {
    const d = new Date(Date.now() - i * 86400000).toISOString().slice(0, 10);
    series.push({ day: d, c: byDay[d] || 0 });
  }
  const max = Math.max(...series.map(s => s.c), 4);
  const innerW = W - padL * 2, plotH = H - padB - padT;
  const step = innerW / series.length;
  const barW = Math.min(step - 2, 26);

  let svg = "";
  [0, 0.5, 1].forEach(t => {
    const y = padT + plotH * (1 - t);
    svg += `<line class="gridline" x1="${padL}" x2="${W - padL}" y1="${y}" y2="${y}"
             ${t > 0 ? 'stroke-dasharray="2,4"' : ""}/>`;
    if (t > 0) svg += `<text class="axis-label" x="${padL}" y="${y - 3}">${Math.round(max * t)}</text>`;
  });

  series.forEach((s, i) => {
    const x = padL + i * step + (step - barW) / 2;
    const h = s.c === 0 ? 0 : Math.max((s.c / max) * plotH, 3);
    const y = padT + plotH - h;
    const label = s.day.slice(5).replace("-", "/");
    if (s.c > 0) {
      const r = Math.min(4, barW / 2, h);
      svg += `<path class="bar" data-tip="${label} — ${s.c} scan${s.c === 1 ? "" : "s"}"
        d="M${x},${y + h} V${y + r} Q${x},${y} ${x + r},${y} H${x + barW - r}
           Q${x + barW},${y} ${x + barW},${y + r} V${y + h} Z" fill="${color}"/>`;
    }
    svg += `<rect class="bar" data-tip="${label} — ${s.c}" x="${padL + i * step}" y="${padT}"
             width="${step}" height="${plotH}" fill="transparent"/>`;
    if (i % 3 === 0) {
      svg += `<text class="axis-label" x="${x + barW / 2}" y="${H - 6}" text-anchor="middle">${label}</text>`;
    }
  });
  svgEl.innerHTML = svg;

  const tip = document.getElementById("tooltip");
  svgEl.querySelectorAll(".bar").forEach(el => {
    el.addEventListener("mousemove", e => {
      tip.textContent = el.dataset.tip;
      tip.style.display = "block";
      tip.style.left = (e.clientX + 12) + "px";
      tip.style.top = (e.clientY - 28) + "px";
    });
    el.addEventListener("mouseleave", () => tip.style.display = "none");
  });
}

ReportIT.topbar("/dashboard").then(async user => {
  if (!user) { location.href = "/login?next=/dashboard"; return; }
  const r = await fetch("/api/admin/stats");
  if (r.status === 403) {
    document.querySelector(".wrap").insertAdjacentHTML("beforeend",
      `<div class="panel" style="padding:30px;text-align:center;color:var(--dim);">
         This area is for the instance admin. Your cases live in
         <a href="/history">Case History</a>.</div>`);
    return;
  }
  const s = await r.json();
  const fmt = n => n.toLocaleString();
  const set = (id, v) => document.getElementById(id).textContent = v;

  set("tUsers", fmt(s.users));
  set("tScans", fmt(s.scans));
  const malicious = s.verdicts["MALICIOUS"] || 0;
  set("tMalicious", fmt(malicious));
  set("tMaliciousSub", s.scans ? `${Math.round(malicious / s.scans * 100)}% of all cases` : "");
  set("tIndicators", fmt(s.indicators));
  const today = new Date().toISOString().slice(0, 10);
  const signupsToday = (s.signups_by_day.find(d => d.day === today) || {}).c || 0;
  set("tUsersSub", `+${signupsToday} today`);

  const draw = () => {
    const css = getComputedStyle(document.documentElement);
    barChart(document.getElementById("scanChart"), s.scans_by_day,
             css.getPropertyValue("--chart-blue").trim());
    barChart(document.getElementById("signupChart"), s.signups_by_day,
             css.getPropertyValue("--chart-teal").trim());
  };
  draw();
  new MutationObserver(draw).observe(document.documentElement,
    { attributes: true, attributeFilter: ["data-theme"] });

  const order = [["MALICIOUS", "bad"], ["SUSPICIOUS", "warn"], ["LIKELY CLEAN", "ok"]];
  document.getElementById("verdictSplit").innerHTML = order.map(([v, cls]) =>
    `<span class="split-item"><span class="dot ${cls}"></span>${v}
     <b>${fmt(s.verdicts[v] || 0)}</b></span>`).join("");

  document.getElementById("userRows").innerHTML = s.recent_users.map(u => `
    <tr><td>${esc(u.name)}</td><td class="mono">${esc(u.email)}</td>
        <td class="mono">${u.scan_count}</td>
        <td class="mono">${esc((u.created_at || "").slice(0, 10))}</td></tr>`).join("")
    || `<tr><td colspan="4" style="color:var(--faint)">No users yet.</td></tr>`;

  document.getElementById("scanRows").innerHTML = s.recent_scans.map(sc => `
    <tr><td class="mono">#${esc(sc.case_id)}</td>
        <td><span class="chip ${chip(sc.verdict)}">${esc(sc.verdict)}</span></td>
        <td class="mono">${esc(sc.from_addr || "—")}</td>
        <td class="mono">${esc(sc.email || "—")}</td></tr>`).join("")
    || `<tr><td colspan="4" style="color:var(--faint)">No cases yet.</td></tr>`;
});
</script>
</body>
</html>
