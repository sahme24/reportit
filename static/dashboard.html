<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CatPhish</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css">
<style>
  .tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:20px;}
  @media (max-width:860px){.tiles{grid-template-columns:1fr 1fr;}}
  .tile{padding:20px 22px;}
  .tile .lab{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--faint);}
  .tile .num{font-family:var(--font-display);font-size:32px;font-weight:700;margin-top:4px;}
  .tile .sub{font-size:12.5px;color:var(--faint);margin-top:2px;}
  .verdict-split{display:flex;gap:16px;flex-wrap:wrap;padding:15px 18px;}
  .split-item{display:flex;align-items:center;gap:8px;font-size:13.5px;color:var(--dim);}
  .split-item b{color:var(--ink);font-family:var(--font-display);}
</style>
</head>
<body>
<div id="topbar"></div>

<div class="wrap page">
  <div style="margin-bottom:22px;">
    <h2 style="font-size:24px;font-weight:700;">Your Dashboard</h2>
  </div>

  <div class="tiles">
    <div class="panel tile lift">
      <div class="lab">Your Cases</div>
      <div class="num" id="uScans">-</div>
      <div class="sub" id="uKinds"></div>
    </div>
    <div class="panel tile">
      <div class="lab">Threats Caught</div>
      <div class="num" id="uThreats" style="color:var(--red);">-</div>
      <div class="sub" id="uThreatsSub"></div>
    </div>
    <div class="panel tile">
      <div class="lab">Likely Clean</div>
      <div class="num" id="uClean" style="color:var(--teal);">-</div>
    </div>
    <div class="panel tile">
      <div class="lab">Free Scans Left Today</div>
      <div class="num" id="uAi">-</div>
      <div class="sub" id="uAiSub"></div>
    </div>
  </div>

  <!-- What every scan does, rather than how many scans have run. Usage
       counts on a young tool advertise how little it has been used, and
       they say nothing about whether it is any good. These are fixed
       properties of the scanner, verifiable in the source, and true on
       day one -- so they are hard-coded deliberately rather than queried.
       Update them when the checks change: 49 is the number of distinct
       Finding() sites across threadline/. The heading says "can run", not
       "runs on every scan", because 7 of those are SMS-only and never
       fire on an email. The language figure is len(content.LANGUAGES), and
       tests/test_content.py fails if the two drift apart. -->
  <div class="panel" style="margin-bottom:20px;">
    <div class="panel-head"><span class="panel-title">What CatPhish can run</span></div>
    <div class="verdict-split">
      <span class="split-item">Detection checks <b>49</b></span>
      <span class="split-item">Threat-intel sources <b>4</b></span>
      <span class="split-item">Scam-phrase languages <b>10</b></span>
    </div>
  </div>

  <div class="panel">
    <div class="panel-head">
      <span class="panel-title">Your latest cases</span>
      <a class="btn primary" href="/scan" style="text-decoration:none;">New Scan &rarr;</a>
    </div>
    <div class="table-scroll">
      <table class="data" id="uTable">
        <thead><tr><th>Case</th><th>Type</th><th>Verdict</th><th>Risk</th><th>Opened</th></tr></thead>
        <tbody id="uRows"></tbody>
      </table>
      <div id="uEmpty" style="display:none;padding:36px;text-align:center;color:var(--faint);">
        No cases yet. <a href="/scan">Scan your first message &rarr;</a>
      </div>
    </div>
  </div>
</div>

<script src="/static/shared.js"></script>
<script>
const esc = CatPhish.esc;
const chip = v => v === "MALICIOUS" ? "bad" : v === "SUSPICIOUS" ? "warn" : "ok";
const kindIcon = k => k === "sms" ? "SMS" : "Email";

/* "3:45 PM" today, "3:45 PM tomorrow" if it lands on another day. */
const fmtTime = iso => {
  if (!iso) return "";
  const d = new Date(iso);
  const t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  return d.toDateString() === new Date().toDateString() ? t : `${t} tomorrow`;
};

CatPhish.topbar("/dashboard").then(async user => {
  if (!user) { location.href = "/login?next=/dashboard"; return; }

  const s = await (await fetch("/api/my/stats")).json();
  const fmt = n => n.toLocaleString();
  const set = (id, v) => document.getElementById(id).textContent = v;

  set("uScans", fmt(s.scans));
  set("uKinds", `${s.email} email, ${s.sms} SMS`);
  set("uThreats", fmt(s.malicious + s.suspicious));
  set("uThreatsSub", `${s.malicious} malicious, ${s.suspicious} suspicious`);
  set("uClean", fmt(s.clean));
  if (!s.ai_enabled) {
    set("uAi", "∞"); set("uAiSub", "AI not enabled on this server");
  } else {
    set("uAi", `${s.ai_uses_left} / ${s.ai_limit}`);
    // Claude/ChatGPT-style: surface the precise next-refresh time as soon
    // as any usage exists, not only once the count hits zero -- a rolling
    // window is confusing without a concrete "when" attached to it.
    set("uAiSub", s.ai_refresh_at
        ? (s.ai_uses_left === 0 ? `more at ${fmtTime(s.ai_refresh_at)}`
                                : `next slot frees ${fmtTime(s.ai_refresh_at)}`)
        : "3 free AI scans, any 24h window");
  }

  if (!s.recent.length) {
    document.getElementById("uTable").style.display = "none";
    document.getElementById("uEmpty").style.display = "";
    return;
  }
  document.getElementById("uRows").innerHTML = s.recent.map(c => `
    <tr>
      <td class="mono">#${esc(c.case_id)}</td>
      <td>${kindIcon(c.kind)}</td>
      <td><span class="chip ${chip(c.verdict)}">${esc(c.verdict)}</span></td>
      <td class="mono">${c.score}/100</td>
      <td class="mono">${esc((c.created_at || "").slice(0, 16).replace("T", " "))}</td>
    </tr>`).join("");
});
</script>
</body>
</html>
