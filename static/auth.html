<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in — ReportIT.ai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/theme.css">
<style>
  .auth-wrap{max-width:440px;margin:56px auto 0;}
  .auth-title{text-align:center;margin-bottom:22px;}
  .auth-title h2{font-size:24px;font-weight:700;}
  .auth-title p{color:var(--dim);font-size:14px;margin:8px 0 0;}
  .tabs{display:flex;border-bottom:1px solid var(--line);}
  .tab{
    flex:1;text-align:center;padding:14px;cursor:pointer;
    font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;color:var(--faint);
    border-bottom:3px solid transparent;margin-bottom:-1px;
  }
  .tab.active{color:var(--primary);border-bottom-color:var(--primary);}
  .field{margin-bottom:16px;}
  .auth-note{
    font-size:13px;color:var(--faint);margin-top:18px;line-height:1.7;
    padding-top:16px;border-top:1px solid var(--line);
  }
</style>
</head>
<body>
<div id="topbar"></div>

<div class="wrap page">
  <div class="auth-wrap">
    <div class="auth-title">
      <h2>Welcome to ReportIT<span style="color:var(--primary)">.ai</span></h2>
      <p>Your case history is saved to your account.</p>
    </div>
    <div class="panel lift">
      <div class="tabs">
        <div class="tab" data-mode="login" onclick="setMode('login')">Sign in</div>
        <div class="tab" data-mode="signup" onclick="setMode('signup')">Create account</div>
      </div>
      <div class="panel-body" style="padding:26px;">
        <form id="authForm" onsubmit="return submitAuth(event)">
          <div class="field" id="nameField" style="display:none;">
            <label><span class="field-label">Name</span>
              <input type="text" id="name" autocomplete="name" placeholder="What should we call you?">
            </label>
          </div>
          <div class="field">
            <label><span class="field-label">Email</span>
              <input type="email" id="email" autocomplete="email" required placeholder="you@example.com">
            </label>
          </div>
          <div class="field">
            <label><span class="field-label">Password</span>
              <input type="password" id="password" autocomplete="current-password" required
                     minlength="8" placeholder="8+ characters">
            </label>
          </div>
          <button class="btn primary" type="submit" id="submitBtn" style="width:100%;justify-content:center;">Sign in</button>
          <div class="form-error" id="error"></div>
        </form>
        <div class="auth-note">
          Accounts exist so your case history is yours — nothing else.
          Passwords are salted &amp; hashed (PBKDF2), and the
          <a href="https://github.com/YOURUSERNAME/reportit">code is public</a>
          if you'd like to check.
        </div>
      </div>
    </div>
  </div>
</div>

<script src="/static/shared.js"></script>
<script>
let mode = new URLSearchParams(location.search).get("mode") === "signup" ? "signup" : "login";

function setMode(m) {
  mode = m;
  document.querySelectorAll(".tab").forEach(t =>
    t.classList.toggle("active", t.dataset.mode === m));
  document.getElementById("nameField").style.display = m === "signup" ? "" : "none";
  document.getElementById("submitBtn").textContent =
    m === "signup" ? "Create free account" : "Sign in";
  document.getElementById("password").autocomplete =
    m === "signup" ? "new-password" : "current-password";
  document.getElementById("error").textContent = "";
}

async function submitAuth(e) {
  e.preventDefault();
  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  try {
    const body = {
      email: document.getElementById("email").value,
      password: document.getElementById("password").value,
    };
    if (mode === "signup") body.name = document.getElementById("name").value;
    const r = await fetch(`/api/${mode}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body),
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    location.href = new URLSearchParams(location.search).get("next") || "/scan";
  } catch (err) {
    document.getElementById("error").textContent = err.message;
    btn.disabled = false;
  }
  return false;
}

ReportIT.topbar("/login").then(user => { if (user) location.href = "/scan"; });
setMode(mode);
</script>
</body>
</html>
