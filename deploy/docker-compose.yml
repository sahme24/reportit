# CatPhish on a plain VM (written for Oracle Cloud Always Free).
#
# Two containers: the app, and Caddy in front of it to terminate TLS.
# Caddy is not decoration -- Let's Encrypt won't issue a certificate for a
# bare IP address and Google OAuth won't redirect to a plain-http callback,
# so "run the container on port 80" genuinely cannot serve this app.
#
# Always start it with the env file spelled out, so that ${CATPHISH_DOMAIN}
# below resolves from the repo-root .env rather than an empty string:
#
#   docker compose --env-file ../.env up -d --build

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      # Overrides whatever .env says: the database must land on the named
      # volume below, not inside the container's own filesystem, or every
      # rebuild silently wipes the users table.
      THREADLINE_DB: /data/threadline.db
      PORT: "8080"
    volumes:
      - catphish-data:/data
    # Deliberately NOT published to the host. Only Caddy should reach the
    # app, so the plain-http port can't be hit directly on the VM's public
    # IP, bypassing TLS.
    expose:
      - "8080"
    healthcheck:
      # /healthz needs no database and no auth, so it answers even when
      # something deeper is broken -- which is what makes it a usable
      # restart trigger rather than a false alarm.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8080/healthz', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      # Generous: the first start imports the app and opens the database.
      start_period: 90s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # Only the domain, NOT env_file. Caddy has no use for the Anthropic
      # key or the OAuth secret, and handing a container credentials it
      # doesn't need is how those credentials end up somewhere unexpected.
      CATPHISH_DOMAIN: ${CATPHISH_DOMAIN:?set CATPHISH_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data      # issued certificates -- losing this re-requests
      - caddy-config:/config  # them, and Let's Encrypt rate-limits that
    depends_on:
      - app

volumes:
  catphish-data:
  caddy-data:
  caddy-config:
